---
# Processes to monitor — whitelist important services individually.
# Uses only comm-based matching (reads /proc/PID/stat — very cheap).
# No catch-all: unmatched processes are simply not tracked.
#
# NOTE: This must be a multi-line string, NOT a YAML list, because the
# upstream collection template dumps it verbatim into the config file.
#
# NOTE: This lives in vars/ (not defaults/) so it takes precedence over the
# collection role's own defaults when loaded via include_role.
# Override in group_vars / host_vars to add site-specific processes.
process_exporter_names: "[{name: '{{.Comm}}', cmdline: [.+]}]"
